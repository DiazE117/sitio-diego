<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>café · diego díaz</title>
<meta name="description" content="granos y equipo · diego díaz" />

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-[#111111] text-[#ededed] antialiased">

  <!-- ===================== NAV ===================== -->
  <nav class="fixed top-0 left-0 w-full z-50 transition-opacity duration-200">
    <div class="flex items-center justify-center gap-6 sm:gap-12 py-8">
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="index.html">yo</a>
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="fotos.html">fotos</a>
      <a class="text-xl sm:text-2xl font-display font-semibold text-center" href="cafe.html">café</a>
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="index.html#libros">libros</a>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <div class="animate-page-enter">
    <main class="min-h-screen px-6 sm:px-8 pt-[18vh] pb-24">
      <div class="max-w-3xl mx-auto">

        <!-- ===== Granos ===== -->
        <section>
          <div class="flex items-center gap-3 mb-8">
            <h2 class="text-2xl font-light tracking-tight" style="font-family:'Lexend Deca', sans-serif">granos</h2>
            <span class="text-sm text-white/35" id="granos-count">0</span>
          </div>

          <p class="text-sm font-medium tracking-wide uppercase text-white/25 mb-6" style="font-family:'Lexend Deca', sans-serif">en taza ahora</p>
          <div id="granos-actual" class="grid grid-cols-1 sm:grid-cols-2 gap-8 sm:gap-12 items-start"></div>

          <p class="text-sm font-medium tracking-wide uppercase text-white/25 mb-6 mt-14" style="font-family:'Lexend Deca', sans-serif">anteriores</p>
          <div id="granos-anteriores" class="grid grid-cols-2 sm:grid-cols-4 gap-8"></div>
        </section>

        <!-- Separador -->
        <div class="mt-12 mb-14 h-[2px] rounded-full bg-gradient-to-r from-transparent via-white/12 to-transparent"></div>

        <!-- ===== Equipo ===== -->
        <section>
          <div class="flex items-center gap-3 mb-8">
            <h2 class="text-2xl font-light tracking-tight" style="font-family:'Lexend Deca', sans-serif">equipo</h2>
            <span class="text-sm text-white/35" id="equipo-count">0</span>
          </div>
          <div id="equipo" class="grid grid-cols-1 sm:grid-cols-2 gap-8 sm:gap-12"></div>
          <div class="mt-12 h-[2px] rounded-full bg-gradient-to-r from-transparent via-white/12 to-transparent"></div>
        </section>

        <!-- ===== Footer ===== -->
        <p class="mt-20 mb-6 text-center text-xs text-white/35 tracking-widest" style="font-family:'Silkscreen', cursive">hecho con 🫶🏽 en querétaro</p>

      </div>
    </main>
  </div>

  <script src="cafe-data.js"></script>
  <script src="cafe.js"></script>
</body>
</html>
