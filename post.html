<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>post · diego díaz</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<style>
  /* ============================================================
     Tipografía del post (markdown renderizado)
     ============================================================ */
  .prose { color: rgba(237, 237, 237, 0.92); font-size: 17px; line-height: 1.75; }
  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-family: 'Lexend Deca', sans-serif;
    color: #ededed; line-height: 1.25; margin-top: 2em; margin-bottom: 0.6em;
  }
  .prose h1 { font-size: 2rem; font-weight: 600; }
  .prose h2 { font-size: 1.55rem; font-weight: 500; }
  .prose h3 { font-size: 1.2rem; font-weight: 500; }
  .prose p  { margin: 0 0 1.1em 0; }
  .prose a  { color: #a3d8ff; text-decoration: underline; text-underline-offset: 3px; }
  .prose a:hover { color: #cce8ff; }
  .prose strong { color: #fff; font-weight: 600; }
  .prose em { color: rgba(237,237,237,0.85); }
  .prose ul, .prose ol { margin: 0 0 1.2em 1.4em; }
  .prose li { margin: 0.3em 0; }
  .prose blockquote {
    border-left: 3px solid rgba(255,255,255,0.18);
    padding: 0.4em 1em;
    margin: 1.5em 0;
    color: rgba(237,237,237,0.7);
    font-style: italic;
  }
  .prose code {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9em;
  }
  .prose pre {
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
    overflow-x: auto;
    margin: 1.5em 0;
    font-size: 13px;
    line-height: 1.6;
  }
  .prose pre code { background: none; border: 0; padding: 0; }
  .prose img { max-width: 100%; border-radius: 10px; margin: 1.5em auto; display: block; }
  .prose hr {
    border: 0;
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.18), transparent);
    margin: 2.5em 0;
  }
</style>
</head>

<body class="bg-[#111111] text-[#ededed] antialiased">

  <!-- ===================== NAV ===================== -->
  <nav class="fixed top-0 left-0 w-full z-50 transition-opacity duration-200">
    <div class="flex items-center justify-center gap-6 sm:gap-12 py-8">
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="index.html">yo</a>
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="fotos.html">fotos</a>
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="cafe.html">café</a>
      <a class="text-xl sm:text-2xl font-display text-subtle hover:opacity-100 text-center" href="libros.html">libros</a>
      <a class="text-xl sm:text-2xl font-display font-semibold text-center" href="lifestyle.html">lifestyle</a>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <div class="animate-page-enter">
    <main class="min-h-screen px-6 sm:px-8 pt-[18vh] pb-24">
      <article class="max-w-2xl mx-auto">

        <!-- Volver -->
        <a href="lifestyle.html" class="text-sm text-white/40 hover:text-white/70">← volver</a>

        <!-- Header del post -->
        <header id="post-header" class="mt-6 mb-10 hidden">
          <p class="text-xs text-white/40 mono uppercase tracking-widest" id="post-cat" style="font-family:'JetBrains Mono', monospace"></p>
          <h1 id="post-title" class="mt-3 text-3xl sm:text-5xl font-light tracking-tight" style="font-family:'Lexend Deca', sans-serif"></h1>
          <p id="post-subtitle" class="mt-3 text-base sm:text-lg text-white/50 italic"></p>
          <p id="post-date" class="mt-4 text-xs text-white/35"></p>
        </header>

        <!-- Banner opcional -->
        <div id="post-banner" class="hidden mb-10 rounded-2xl overflow-hidden">
          <img id="post-banner-img" src="" alt="" class="w-full h-auto object-cover" />
        </div>

        <!-- Contenido del post -->
        <div id="post-content" class="prose"></div>

        <!-- 404 -->
        <div id="post-404" class="hidden text-center py-20">
          <p class="text-white/55">post no encontrado.</p>
          <a href="lifestyle.html" class="text-sm text-white/40 hover:text-white/70 mt-3 inline-block">← volver al blog</a>
        </div>

        <!-- Footer -->
        <p class="mt-20 mb-6 text-center text-xs text-white/35 tracking-widest" style="font-family:'Silkscreen', cursive">hecho con 🫶🏽 en querétaro</p>

      </article>
    </main>
  </div>

  <script src="lifestyle-data.js"></script>
  <script src="post.js"></script>
  <script src="nav.js"></script>
</body>
</html>
